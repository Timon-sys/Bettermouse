name: "Release"

# Tag a commit with v* and push it, and this builds the fap against the
# Momentum SDK and publishes it as a GitHub release asset.
#
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  # Lets you re-run it by hand from the Actions tab against an existing tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Build and publish fap"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt (Momentum SDK)
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
          sdk-channel: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Better Mouse ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ steps.build-app.outputs.fap-artifacts }}
